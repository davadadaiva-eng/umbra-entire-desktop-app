# coturn TURN relay — WebRTC NAT traversal fallback for the phone PWA
# (see docs/cloud-deploy.md). Runs behind the `edge` compose profile.

# Plain UDP/TCP TURN, plus TLS (TURNS).
listening-port=3478
tls-listening-port=5349

# Match real-world NAT behavior.
fingerprint
lt-cred-mech
realm=umbra
stale-nonce=600
total-quota=100
no-cli

# Static credential (single-tenant deployment). Replace with your own secret.
# Reference it from config as: turn:turnuser:turnpass@<server>:3478
user=turnuser:turnpass

# Public hostname used in TURN responses.
server-name=turn.example.com

# For multi-credential setups you can switch to ephemeral time-limited
# credentials instead of the static user above:
#   use-auth-secret
#   static-auth-secret=change-me
