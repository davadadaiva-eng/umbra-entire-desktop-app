services:
  umbra:
    build: .
    container_name: umbra-os
    restart: unless-stopped
    ports:
      - "8787:8787"   # REST + WS + MCP API
      - "8788:8788"   # DeviceHub WebSocket (device mesh)
    environment:
      - UMBRA_HEADLESS=1
      - UMBRA_ROLE=cloud
      - UMBRA_CONSENT_AUTOGRANT=1
      # Public base URL used to mint QR/join links (set to your domain).
      - UMBRA_PUBLIC_URL=${UMBRA_PUBLIC_URL:-https://localhost}
      # OpenRouter key — used by both Umbra's LLM router AND Hermes Agent
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Hermes Agent config
      - HERMES_HOME=/root/.hermes
      - HERMES_ACCEPT_HOOKS=1
    volumes:
      - umbra-data:/root/.umbra
      - hermes-data:/root/.hermes

  # ── TLS termination (auto Let's Encrypt) for the API + DeviceHub ──────
  # Run with: docker compose --profile edge up -d
  # Set UMBRA_DOMAIN=umbra.example.com (Caddy issues the cert automatically).
  caddy:
    image: caddy:2-alpine
    container_name: umbra-caddy
    restart: unless-stopped
    profiles: ["edge"]
    environment:
      - UMBRA_DOMAIN=${UMBRA_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - umbra

  # ── TURN relay for WebRTC NAT traversal (phone PWA off-LAN) ───────────
  # Linux VPS only (host networking, standard for TURN). Edit
  # deploy/turnserver.conf credentials, then add the turn: URL to config:
  #   p2p.turnServers = ["turn:turnuser:turnpass@<server>:3478"]
  coturn:
    image: coturn/coturn:latest
    container_name: umbra-turn
    restart: unless-stopped
    profiles: ["edge"]
    network_mode: host
    command: ["-c", "/etc/turnserver.conf"]
    volumes:
      - ./deploy/turnserver.conf:/etc/turnserver.conf:ro

  # Local, free, private voice-to-text (whisper.cpp).
  # Download the model first: MODEL=medium.en ./scripts/download-whisper-model.sh
  # Then set voice.sttProvider = "whisper-local" and
  # voice.sttEndpoint = "http://whisper:8080" in the cloud's config.
  whisper:
    image: ghcr.io/ggerganov/whisper.cpp:main
    container_name: umbra-whisper
    restart: unless-stopped
    # medium.en = strong accuracy (~2.1 GB RAM); use small.en (~852 MB) on a 4 GB box.
    command: ["-m", "/models/ggml-medium.en.bin", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"

volumes:
  umbra-data:
  hermes-data:
  caddy-data:
  caddy-config:
